name: Integration Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  integration:
    name: Integration tests (live MarkLogic)
    runs-on: ubuntu-latest

    services:
      marklogic:
        image: progressofficial/marklogic-db:latest-12
        ports:
          - 8000:8000
          - 8002:8002
        env:
          MARKLOGIC_INIT: "true"
          MARKLOGIC_ADMIN_USERNAME: admin
          MARKLOGIC_ADMIN_PASSWORD: admin
        options: >-
          --health-cmd "curl -sf http://localhost:8001/admin/v1/timestamp || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 90s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Wait for MarkLogic to initialise
        run: |
          echo "Waiting for MarkLogic REST and Management APIs to be ready..."
          for i in $(seq 1 24); do
            if curl -sf --digest -u admin:admin http://localhost:8002/manage/v2 > /dev/null 2>&1 && \
               curl -sf --digest -u admin:admin http://localhost:8000/v1/search > /dev/null 2>&1; then
              echo "MarkLogic is ready (attempt $i)."
              break
            fi
            echo "  attempt $i/24 — sleeping 5s"
            sleep 5
          done

      - name: Seed test data
        run: node scripts/integration-seed.mjs
        env:
          ML_HOST: localhost
          ML_USER: admin
          ML_PASSWORD: admin

      - name: Run integration tests
        run: npm run test:integration
        env:
          ML_HOST: localhost
          ML_PORT: "8000"
          ML_MGMT_PORT: "8002"
          ML_USER: admin
          ML_PASSWORD: admin
          ML_AUTH_TYPE: digest
          ML_ALLOW_EVAL: "true"
          ML_READONLY: "false"
