name: Integration Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  integration:
    name: Integration tests (live MarkLogic)
    runs-on: ubuntu-latest

    services:
      marklogic:
        image: progressofficial/marklogic-db:latest-12
        ports:
          - 8000:8000
          - 8002:8002
        env:
          MARKLOGIC_INIT: "true"
          MARKLOGIC_ADMIN_USERNAME: admin
          MARKLOGIC_ADMIN_PASSWORD: admin
        options: >-
          --health-cmd "curl -sf http://localhost:8001/admin/v1/timestamp || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 90s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Wait for MarkLogic to initialise
        run: |
          echo "Waiting for MarkLogic REST API on port 8000..."
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/v1/search 2>/dev/null || echo "000")
            if [ "$STATUS" != "000" ] && [ -n "$STATUS" ]; then
              echo "MarkLogic is ready (HTTP $STATUS)."
              break
            fi
            echo "  attempt $i/20 — sleeping 5s"
            sleep 5
          done

      - name: Seed test data
        run: node scripts/integration-seed.mjs
        env:
          ML_HOST: localhost
          ML_USER: admin
          ML_PASSWORD: admin

      - name: Run integration tests
        run: npm run test:integration
        env:
          ML_HOST: localhost
          ML_PORT: "8000"
          ML_MGMT_PORT: "8002"
          ML_USER: admin
          ML_PASSWORD: admin
          ML_AUTH_TYPE: digest
          ML_ALLOW_EVAL: "true"
          ML_READONLY: "false"
