name: Integration Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  integration:
    name: Integration tests (live MarkLogic)
    runs-on: ubuntu-latest

    services:
      marklogic:
        image: progressofficial/marklogic-db:latest-12
        ports:
          - 8000:8000
          - 8002:8002
        env:
          MARKLOGIC_INIT: "true"
          MARKLOGIC_ADMIN_USERNAME: admin
          MARKLOGIC_ADMIN_PASSWORD: admin
        options: >-
          --health-cmd "curl -sf http://localhost:8001/admin/v1/timestamp || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 90s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Wait for MarkLogic to initialise
        run: |
          echo "Waiting for MarkLogic REST and Management APIs to be ready..."
          # The container's healthcheck and these endpoints can return 200 while
          # MarkLogic is mid-restart applying an admin-config reload — writes
          # then fail with 503 "Restarting to reload server config". Require
          # THREE consecutive successful probes spaced 3s apart to skip the
          # restart window before we hand off to the seed step.
          ok_streak=0
          for i in $(seq 1 36); do
            if curl -sf --digest -u admin:admin http://localhost:8002/manage/v2 > /dev/null 2>&1 && \
               curl -sf --digest -u admin:admin http://localhost:8000/v1/search > /dev/null 2>&1; then
              ok_streak=$((ok_streak + 1))
              echo "  attempt $i/36 — ok ($ok_streak/3)"
              if [ $ok_streak -ge 3 ]; then
                echo "MarkLogic is stable (3 consecutive ok responses)."
                break
              fi
              sleep 3
            else
              ok_streak=0
              echo "  attempt $i/36 — not ready, sleeping 5s"
              sleep 5
            fi
          done

      - name: Seed test data
        run: node scripts/integration-seed.mjs
        env:
          ML_HOST: localhost
          ML_USER: admin
          ML_PASSWORD: admin

      - name: Run integration tests
        run: npm run test:integration
        env:
          ML_HOST: localhost
          ML_PORT: "8000"
          ML_MGMT_PORT: "8002"
          ML_USER: admin
          ML_PASSWORD: admin
          ML_AUTH_TYPE: digest
          ML_ALLOW_EVAL: "true"
          ML_READONLY: "false"
