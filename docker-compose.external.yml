version: "3.9"

# MCP server + Flux runner — connects to MarkLogic and/or Semaphore containers
# that are already running on the same Docker host (separate compose projects
# or standalone containers).
#
# ──────────────────────────────────────────────────────────────────────
# NETWORKING
# ──────────────────────────────────────────────────────────────────────
# Containers in different compose projects get different bridge networks by
# default and cannot reach each other by service name. This file solves that
# with a shared external network called "shared".
#
# ONE-TIME SETUP — create the shared network:
#
#   docker network create shared
#
# Then attach your existing MarkLogic and Semaphore containers to it. You can
# either:
#
#   a) Add `networks: [shared]` to their own compose files (see docs/docker-networking.md)
#   b) Attach running containers on the fly:
#        docker network connect shared <marklogic-container-name>
#        docker network connect shared <semaphore-container-name>
#
# Once on the same network the MCP server can reach them by container name
# (e.g. ML_HOST=marklogic, SEMAPHORE_HOST=semaphore).
#
# ──────────────────────────────────────────────────────────────────────
# USAGE
# ──────────────────────────────────────────────────────────────────────
#
#   # MCP server only (MarkLogic container named "marklogic"):
#   ML_HOST=marklogic ML_PASSWORD=admin \
#     docker compose -f docker-compose.external.yml up -d
#
#   # With Flux sidecar:
#   ML_HOST=marklogic ML_PASSWORD=admin \
#     docker compose -f docker-compose.external.yml --profile flux up -d
#
#   # With Semaphore:
#   ML_HOST=marklogic SEMAPHORE_HOST=semaphore ML_PASSWORD=admin \
#     docker compose -f docker-compose.external.yml up -d

networks:
  shared:
    external: true

services:
  flux-runner:
    image: ghcr.io/tternquist/marklogic-mcp/flux-runner:master
    container_name: mcp-flux-runner
    restart: unless-stopped
    profiles: ["flux"]
    networks: [shared]
    environment:
      - FLUX_PORT=8080
      - FLUX_TIMEOUT_MINUTES=${FLUX_TIMEOUT_MINUTES:-30}
    volumes:
      - ${FLUX_DATA_DIR:-./flux-data}:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  marklogic-mcp:
    image: ghcr.io/tternquist/marklogic-mcp:master
    container_name: marklogic-mcp
    restart: unless-stopped
    networks: [shared]
    environment:
      # Transport
      - MCP_TRANSPORT=${MCP_TRANSPORT:-http}
      - MCP_HTTP_PORT=${MCP_HTTP_PORT:-3000}
      - MCP_HTTP_HOST=${MCP_HTTP_HOST:-0.0.0.0}
      - MCP_API_KEY=${MCP_API_KEY:-}

      # MarkLogic — use the container name of your MarkLogic instance
      - ML_HOST=${ML_HOST:-marklogic}
      - ML_PORT=${ML_PORT:-8000}
      - ML_MANAGEMENT_PORT=${ML_MANAGEMENT_PORT:-8002}
      - ML_USERNAME=${ML_USERNAME:-admin}
      - ML_PASSWORD=${ML_PASSWORD:-admin}
      - ML_DATABASE=${ML_DATABASE:-Documents}
      - ML_AUTH_TYPE=${ML_AUTH_TYPE:-digest}
      - ML_SSL=${ML_SSL:-false}
      - ML_SSL_REJECT_UNAUTHORIZED=${ML_SSL_REJECT_UNAUTHORIZED:-true}

      # Safety
      - ML_READONLY=${ML_READONLY:-true}
      - ML_ALLOW_EVAL=${ML_ALLOW_EVAL:-false}

      # Flux sidecar
      - FLUX_RUNNER_URL=${FLUX_RUNNER_URL:-http://mcp-flux-runner:8080}

      # Semaphore — use the container name of your Semaphore instance
      - SEMAPHORE_HOST=${SEMAPHORE_HOST:-}
      - SEMAPHORE_SCS_PORT=${SEMAPHORE_SCS_PORT:-5058}
      - SEMAPHORE_KMM_PORT=${SEMAPHORE_KMM_PORT:-5080}
      - SEMAPHORE_USERNAME=${SEMAPHORE_USERNAME:-}
      - SEMAPHORE_PASSWORD=${SEMAPHORE_PASSWORD:-}
      - SEMAPHORE_SSL=${SEMAPHORE_SSL:-false}
      - SEMAPHORE_TIMEOUT_MS=${SEMAPHORE_TIMEOUT_MS:-30000}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-pretty}
    depends_on:
      flux-runner:
        condition: service_healthy
        required: false
    ports:
      - "${MCP_HTTP_PORT:-3000}:${MCP_HTTP_PORT:-3000}"
