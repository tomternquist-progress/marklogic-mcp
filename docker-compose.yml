version: "3.9"

# Local MarkLogic 12 development environment + MCP server
services:
  marklogic:
    image: progressofficial/marklogic-db:12.0-rootless
    container_name: marklogic
    ports:
      - "8000:8000"   # REST API
      - "8001:8001"   # Admin UI
      - "8002:8002"   # Management API
    environment:
      - MARKLOGIC_INIT=true
      - MARKLOGIC_ADMIN_USERNAME=admin
      - MARKLOGIC_ADMIN_PASSWORD=admin
    volumes:
      - ml-data:/var/opt/MarkLogic
    healthcheck:
      test: ["CMD", "curl", "-f", "-u", "admin:admin", "http://localhost:8002/manage/v2"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  marklogic-mcp:
    build: .
    container_name: marklogic-mcp
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=3000
      - ML_HOST=marklogic
      - ML_PORT=8000
      - ML_MANAGEMENT_PORT=8002
      - ML_USERNAME=admin
      - ML_PASSWORD=admin
      - ML_AUTH_TYPE=basic
      - ML_READONLY=true
      - ML_ALLOW_EVAL=false
      - LOG_LEVEL=info
      - LOG_FORMAT=pretty
    ports:
      - "3000:3000"
    depends_on:
      marklogic:
        condition: service_healthy

volumes:
  ml-data:
