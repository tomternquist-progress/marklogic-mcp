version: "3.9"

# MCP server only — connects to your existing MarkLogic install.
# Configure via environment variables or create a .env file alongside this file.
#
# Usage:
#   docker compose -f docker-compose.mcp-only.yml up
#
# Or with inline env overrides:
#   ML_HOST=192.168.1.100 ML_PASSWORD=secret docker compose -f docker-compose.mcp-only.yml up

services:
  # Optional Flux sidecar — only started when the "flux" profile is active:
  #   docker compose -f docker-compose.mcp-only.yml --profile flux up
  flux-runner:
    image: ghcr.io/tternquist/marklogic-mcp/flux-runner:master
    container_name: flux-runner
    restart: unless-stopped
    profiles: ["flux"]
    environment:
      - FLUX_PORT=8080
      - FLUX_TIMEOUT_MINUTES=${FLUX_TIMEOUT_MINUTES:-30}
    volumes:
      # Mount a local directory as /data inside the container.
      # Flux import/export paths should reference /data/... when using this compose file.
      - ${FLUX_DATA_DIR:-./flux-data}:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  marklogic-mcp:
    image: ghcr.io/tternquist/marklogic-mcp:master
    container_name: marklogic-mcp
    restart: unless-stopped
    environment:
      # Transport (http exposes the SSE endpoint for remote agents/QuickSight)
      - MCP_TRANSPORT=${MCP_TRANSPORT:-http}
      - MCP_HTTP_PORT=${MCP_HTTP_PORT:-3000}
      - MCP_HTTP_HOST=${MCP_HTTP_HOST:-0.0.0.0}
      - MCP_API_KEY=${MCP_API_KEY:-}          # optional bearer token

      # MarkLogic connection — point at your existing instance
      - ML_HOST=${ML_HOST:-localhost}
      - ML_PORT=${ML_PORT:-8000}
      - ML_MANAGEMENT_PORT=${ML_MANAGEMENT_PORT:-8002}
      - ML_USERNAME=${ML_USERNAME:-admin}
      - ML_PASSWORD=${ML_PASSWORD:-admin}
      - ML_DATABASE=${ML_DATABASE:-Documents}
      - ML_AUTH_TYPE=${ML_AUTH_TYPE:-digest}
      - ML_SSL=${ML_SSL:-false}
      - ML_SSL_REJECT_UNAUTHORIZED=${ML_SSL_REJECT_UNAUTHORIZED:-true}

      # Safety (read-only by default; set to false to enable writes)
      - ML_READONLY=${ML_READONLY:-true}
      - ML_ALLOW_EVAL=${ML_ALLOW_EVAL:-false}

      # Flux sidecar URL — defaults to the sidecar hostname; works automatically with --profile flux.
      # Set to empty string to disable: FLUX_RUNNER_URL=
      - FLUX_RUNNER_URL=${FLUX_RUNNER_URL:-http://flux-runner:8080}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-pretty}
    depends_on:
      flux-runner:
        condition: service_healthy
        required: false   # ignored when flux-runner isn't started (no --profile flux)
    ports:
      - "${MCP_HTTP_PORT:-3000}:${MCP_HTTP_PORT:-3000}"
